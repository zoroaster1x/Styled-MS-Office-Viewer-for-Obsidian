# Builds and tests every push to master. Cuts a release only when the head
# commit message carries a version marker, for example:
#
#   Styled MS Office Viewer 2.1.1 [release] 2.1.1
#
# The marker version must equal manifest.json. The release notes are generated
# from the commits since the previous release tag, followed by the funding
# section in .github/release-template.md. The three assets are attested so a
# reader can verify where they were built, then uploaded. versions.json stays
# in the repository and is never a release asset.

name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Build the plugin
        run: bun esbuild.config.mjs production

      - name: Run the suites
        run: |
          set -e
          for suite in smoke filters copy virtual sizing meta numfmt cf robust cache doc-legacy math privacy pptx-layout docx-layout drawing vml virtual-docx tiff embed-font jxr; do
            printf "%-14s " "$suite"
            bun test/$suite.mjs 2>&1 | tail -1
          done

      - name: Read the release marker
        id: version
        run: |
          MANIFEST_VERSION=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$MANIFEST_VERSION"
          else
            VERSION=$(git log -1 --pretty=%B | python3 -c "import sys,re;m=re.search(r'\[release\]\s*(\d+\.\d+\.\d+)', sys.stdin.read(), re.I);print(m.group(1) if m else '')")
          fi
          if [ -z "$VERSION" ]; then
            echo "No [release] x.y.z marker in the head commit; this is a normal build."
            exit 0
          fi
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::The commit says [release] $VERSION but manifest.json says $MANIFEST_VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the release notes
        if: steps.version.outputs.version != ''
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 --match '[0-9]*' 2>/dev/null || true)
          if [ -z "$PREVIOUS" ]; then
            RANGE="HEAD"
            PREVIOUS_LABEL="the beginning"
          else
            RANGE="$PREVIOUS..HEAD"
            PREVIOUS_LABEL="$PREVIOUS"
          fi
          git log $RANGE --pretty=format:'- %s' > /tmp/changes.txt
          VERSION="${{ steps.version.outputs.version }}" PREVIOUS_LABEL="$PREVIOUS_LABEL" python3 - <<'PY'
          import os
          template = open(".github/release-template.md", encoding="utf-8").read()
          changes = open("/tmp/changes.txt", encoding="utf-8").read().strip() or "- No changes since the previous release."
          body = (
              template.replace("{{VERSION}}", os.environ["VERSION"])
              .replace("{{PREVIOUS}}", os.environ["PREVIOUS_LABEL"])
              .replace("{{CHANGES}}", changes)
          )
          open("/tmp/release-body.md", "w", encoding="utf-8").write(body)
          PY
          echo "notes written for ${{ steps.version.outputs.version }}"

      - name: Attest build provenance
        if: steps.version.outputs.version != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TITLE="Styled MS Office Viewer $VERSION"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$TITLE" --notes-file /tmp/release-body.md
            gh release upload "$VERSION" main.js manifest.json styles.css --clobber
          else
            gh release create "$VERSION" --title "$TITLE" --notes-file /tmp/release-body.md --target "${{ github.sha }}" main.js manifest.json styles.css
          fi
          echo "Released $VERSION."
