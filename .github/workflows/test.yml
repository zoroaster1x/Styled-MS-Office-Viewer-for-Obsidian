name: Tests

# Runs when the code, the build or the suites change. A commit that only
# touches the README does not need a build and a full suite on every push;
# the release workflow still tests the bundle it publishes from a tag.
# workflow_dispatch keeps a manual run possible.

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "test/**"
      - "styles.css"
      - "esbuild.config.mjs"
      - "package.json"
      - "bun.lock"
      - "manifest.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "styles.css"
      - "esbuild.config.mjs"
      - "package.json"
      - "bun.lock"
      - "manifest.json"
      - ".github/workflows/test.yml"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Build the plugin
        run: bun esbuild.config.mjs production

      - name: Run the suites
        run: |
          set -e
          for suite in smoke filters copy virtual sizing meta numfmt cf robust cache doc-legacy math privacy pptx-layout docx-layout drawing vml tiff embed-font jxr; do
            printf "%-14s " "$suite"
            bun test/$suite.mjs 2>&1 | tail -1
          done
